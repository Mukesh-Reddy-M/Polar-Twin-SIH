name: Polar Twin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Run API tests with pytest
        run: python -m pytest -q services/api/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/api

      - name: Check simulator repeatability
        run: python services/api/scripts/check_simulator_repeatability.py

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build
